
on:
  push:
    - workflows: [ compile-and-review ]
      filter:
        branches: [ dev-khmelev ]
  pull_request:
    - workflows: [ compile-and-review ]
      # filter:
      #   paths: [ "!.sourcecraft/**" ]
      #   source_branches: "feature"
      #   target_branches: "master"

workflows:
  sample-workflow:
    tasks:
      - name: sample-task
        cubes:
          - name: install
            image:
              name: kakadu18/ocaml:rukaml5.5
            env:
              OPAMROOT: /home/opam/.opam
              OPAMCONFIRMLEVEL: unsafe-yes
            script:
              - sudo su -
              - echo "I am $(whoami)"
              - sudo usermod -aG root $(whoami)
              - opam repo set-url default https://se.math.spbu.ru/opam
              - opam update
              - cd $SOURCECRAFT_WORKSPACE
              - git config --global --add safe.directory .

              - cd $(yq -r '.[] | to_entries[] | select(.value[]? == "Kakadu") | .key' teams.yml)
              - opam install . --deps-only --with-test --with-doc --yes # --verbose
              - opam exec -- dune build @install
              #- opam pin add zanuda --dev-repo -y
              - opam exec -- dune b @check
              #- opam exec -- zanuda -dir .
              #- opam exec -- zanuda -dir . -ordjsonl results.json
              #- cat results.json
              #- opam exec -- dune exec ./validate.exe -- 1.json
              #- opam exec -- dune exec ./validate.exe -- results.json

  compile-and-review:
    tasks:
      - name: task-PR-check
        cubes:
          - name: install
            image:
              name: kakadu18/ocaml:comp26
              #entrypoint: "/bin/bash"
            env:
              OPAMROOT: /home/opam/.opam
              OPAMCONFIRMLEVEL: unsafe-yes
              TIMEFMT: '%U'
              COMPILER: shmel
            script:
              #- sudo su -
              - echo "whoami = $(whoami)"
              - sudo usermod -aG root $(whoami)
              - echo "SOURCECRAFT_ROOT_DIRECTORY = $SOURCECRAFT_ROOT_DIRECTORY"
              - echo "SOURCECRAFT_WORKSPACE = $SOURCECRAFT_WORKSPACE"
              - echo "pwd =  $(pwd)..., OPAMROOT = $OPAMROOT"
              #- opam repo set-url default https://se.math.spbu.ru/opam
              - /usr/bin/time -f "%U" opam update
              - echo "There are $(opam list --available --short | wc -l) packages available"
              #- sh -exc .sourcecraft/get_author.sh
              #- jq -r .author prinfo.json
              #- export COMITTER=$(jq -r .author.slug prinfo.json)
              #- echo "comitter = $COMITTER"
              #- rm -fr prinfo.json
              #- cd $SOURCECRAFT_WORKSPACE
              - git config --global --add safe.directory .
              - echo "Compiler calculation, COMPILER=$COMPILER"
              #- cat teams.yml
              - echo "Pinning..."
              - .sourcecraft/dune.sh pin
              - echo "Deps..."
              - sh -ex .sourcecraft/dune.sh deps
              - echo "Build..."
              - opam exec -- sh .sourcecraft/dune.sh build

              #- echo "Pinning Zanuda..."
              #- /usr/bin/time -f "%U"  opam pin add zanuda https://github.com/Kakadu/zanuda.git --yes
              #- opam exec -- dune b @check
              #- opam exec -- zanuda -dir . -ordjsonl results.json -osarif sarif.json
              #- cat results.json
              #- opam exec -- dune exec ./validate.exe -- 1.json
              #- opam exec -- dune exec ./validate.exe -- sarif.json
              #- cp -v sarif.json $SOURCECRAFT_WORKSPACE/result.sarif

          - name: scan-result-uploader
            image:
              name: sourcecraft/scan-result-uploader:0.6.0
            script:
              - ls -l $SOURCECRAFT_WORKSPACE
              # - pwd
              # - cp handcrafted.json result.sarif -v
              # - cat result.sarif
